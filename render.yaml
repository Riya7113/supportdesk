# Render hosts the Python API and PostgreSQL database without Docker.
services:
  - type: web
    name: supportdesk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: supportdesk-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: supportdesk-db
    databaseName: supportdesk
    plan: basic-256mb
    ipAllowList: []
